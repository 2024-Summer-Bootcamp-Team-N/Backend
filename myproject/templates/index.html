<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team-N Server</title>
    <script type="text/javascript">
        var kakaoMapApiKey = '{{ kakaoMapApiKey }}';
        document.write('<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + kakaoMapApiKey + '"><\/script>');
    </script>
    <script type="text/javascript">
        function initMap() {
            var container = document.getElementById('map');
            var options = {
                center: new kakao.maps.LatLng(37.5665, 126.9780),
                level: 3
            };
            var map = new kakao.maps.Map(container, options);
        }
        window.onload = initMap;
    </script>
</head>
<body>
    <h1>Team-N 여러분, 서버에 오신것을 환영합니다!!!</h1>
    <ol>
        {% for topic in topics %}
            <li><a href="/read/{{ topic.id }}">{{ topic.title }}</a></li>
        {% endfor %}
    </ol>
    <h1>우리팀 주제는?</h1>
    <div id="map" style="width:100%;height:400px;"></div>
    <h2>화이팅합시다...</h2>
</body>
</html>
