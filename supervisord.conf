[supervisord]
nodaemon=true
logfile=/dev/null ; no supervisord log
pidfile=/dev/null ; no supervisord PID file

[program:django]
command=python3.9 manage.py runserver 0.0.0.0:8000
directory=/app
user=myuser
autostart=true
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:daphne]
command=daphne -b 0.0.0.0 -p 8001 config.asgi:application
directory=/app
user=myuser
autostart=true
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:celery]
command=celery -A config worker --loglevel=info
directory=/app
user=myuser
autostart=true
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
